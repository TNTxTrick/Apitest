<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Explorer</title>

    <style>
        /* Thiết lập giao diện chung */
        body {
            background-color: #0D1117;
            color: #E6EDF3;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            flex-direction: column;
            padding-top: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            padding: 20px;
        }

        h2 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        p {
            color: #8B949E;
            margin-bottom: 10px;
        }

        input, button {
            padding: 10px;
            width: 100%;
            margin-bottom: 12px;
            border-radius: 5px;
            border: 1px solid #30363D;
            background-color: #21262D;
            color: #E6EDF3;
            font-size: 16px;
        }

        button {
            background-color: #A855F7;
            cursor: pointer;
        }

        button:hover {
            background-color: #8B949E;
        }

        /* Danh sách gợi ý */
        .suggestions {
            background: #161B22;
            border: 1px solid #30363D;
            border-radius: 5px;
            position: absolute;
            width: 100%;
            z-index: 10;
            display: none;
        }

        .suggestions div {
            padding: 10px;
            cursor: pointer;
        }

        .suggestions div:hover {
            background: #A855F7;
        }

        /* Code block */
        pre {
            background-color: #161B22;
            color: #A0B0C0;
            padding: 16px;
            border-radius: 5px;
            overflow-x: auto;
            font-size: 14px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .search-box {
            position: relative;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Ô tìm kiếm API -->
        <div class="search-box">
            <input id="searchAPI" type="text" placeholder="Tìm kiếm API...">
            <div id="suggestions" class="suggestions"></div>
        </div>

        <!-- Giới thiệu API -->
        <h2 id="intro">Chào mừng đến với API Explorer</h2>
        <p>Khám phá các API hữu ích với giao diện đơn giản và dễ sử dụng.</p>

        <!-- Trends API -->
        <div id="trends">
            <h2>Trends API</h2>
            <p>Nhập WOEID để tìm kiếm xu hướng.</p>
            <input id="woeid" type="number" placeholder="Nhập WOEID">
            <button id="fetchTrends">Thử ngay</button>
            <pre><code id="result-trends" class="json"></code></pre>
        </div>

        <!-- User API -->
        <div id="user">
            <h2>User API</h2>
            <p>Lấy thông tin người dùng bằng ID.</p>
            <input id="userId" type="number" placeholder="Nhập User ID">
            <button id="fetchUser">Thử ngay</button>
            <pre><code id="result-user" class="json"></code></pre>
        </div>
    </div>

    <script>
        const apiList = [
            { id: "intro", name: "Giới thiệu" },
            { id: "trends", name: "Trends API" },
            { id: "user", name: "User API" }
        ];

        const searchInput = document.getElementById("searchAPI");
        const suggestionsBox = document.getElementById("suggestions");

        searchInput.addEventListener("input", function () {
            const query = this.value.toLowerCase();
            suggestionsBox.innerHTML = "";
            if (query) {
                const filtered = apiList.filter(api => api.name.toLowerCase().includes(query));
                filtered.forEach(api => {
                    const div = document.createElement("div");
                    div.textContent = api.name;
                    div.onclick = function () {
                        document.getElementById(api.id).scrollIntoView({ behavior: "smooth", block: "start" });
                        searchInput.value = "";
                        suggestionsBox.style.display = "none";
                    };
                    suggestionsBox.appendChild(div);
                });
                suggestionsBox.style.display = "block";
            } else {
                suggestionsBox.style.display = "none";
            }
        });

        document.addEventListener("click", function (event) {
            if (!searchInput.contains(event.target) && !suggestionsBox.contains(event.target)) {
                suggestionsBox.style.display = "none";
            }
        });

        function displayData(id, data) {
            document.getElementById(id).textContent = JSON.stringify(data, null, 2);
        }

        document.getElementById("fetchTrends").addEventListener("click", () => {
            const woeid = document.getElementById("woeid").value.trim();
            if (!woeid) {
                alert("Vui lòng nhập WOEID");
                return;
            }

            const sampleData = { "data": [{ "trend_name": "Công Nghệ Mới" }, { "trend_name": "Bóng Đá Hôm Nay" }] };
            displayData("result-trends", sampleData);
        });

        document.getElementById("fetchUser").addEventListener("click", () => {
            const userId = document.getElementById("userId").value.trim();
            if (!userId) {
                alert("Vui lòng nhập User ID");
                return;
            }

            const sampleData = { "user": { "id": userId, "name": "Người dùng A", "email": "user@example.com" } };
            displayData("result-user", sampleData);
        });
    </script>

</body>
</html>
