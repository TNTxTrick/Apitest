<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Explorer</title>

    <style>
        /* Giao diện chính */
        body {
            background-color: #0D1117;
            color: #E6EDF3;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        h2 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        p {
            color: #8B949E;
            margin-bottom: 10px;
        }

        /* Nút copy link API */
        .api-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .api-buttons button {
            padding: 12px 24px;
            font-weight: bold;
            border-radius: 20px;
            border: none;
            background-color: #A855F7;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease-in-out;
        }

        .api-buttons button:hover {
            background-color: #8B949E;
        }

        .api-buttons button:active {
            box-shadow: 0 0 15px #A855F7;
        }

        /* Code block */
        pre {
            background-color: #161B22;
            color: #A0B0C0;
            padding: 16px;
            border-radius: 5px;
            overflow-x: auto;
            font-size: 14px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Nút copy API -->
        <div class="api-buttons">
            <button onclick="copyAPI('https://api.example.com/trends')">Copy Trends API</button>
            <button onclick="copyAPI('https://api.example.com/user')">Copy User API</button>
        </div>

        <!-- Trends API -->
        <div id="trends">
            <h2>Trends API</h2>
            <p>Dữ liệu API:</p>
            <pre><code id="result-trends" class="json"></code></pre>
        </div>

        <!-- User API -->
        <div id="user">
            <h2>User API</h2>
            <p>Dữ liệu API:</p>
            <pre><code id="result-user" class="json"></code></pre>
        </div>
    </div>

    <script>
        function copyAPI(apiUrl) {
            navigator.clipboard.writeText(apiUrl).then(() => {
                alert("Đã sao chép: " + apiUrl);
            }).catch(err => {
                alert("Lỗi khi sao chép!");
                console.error(err);
            });
        }

        function displayData(id, data) {
            document.getElementById(id).textContent = JSON.stringify(data, null, 2);
        }

        // Hiển thị sẵn dữ liệu API
        const trendsData = { "data": [{ "trend_name": "Công Nghệ Mới" }, { "trend_name": "Bóng Đá Hôm Nay" }] };
        displayData("result-trends", trendsData);

        const userData = { "user": { "id": "12345", "name": "Người dùng A", "email": "user@example.com" } };
        displayData("result-user", userData);
    </script>

</body>
</html>
