<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        bg: '#0D1117',
                        text: '#E6EDF3',
                        card: '#161B22',
                        border: '#30363D',
                        primary: '#A855F7',
                        muted: '#21262D'
                    }
                }
            }
        };
    </script>

    <style>
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 250px;
            height: 100%;
            background: rgba(22, 27, 34, 0.8);
            backdrop-filter: blur(8px);
            transform: translateX(-100%);
            transition: 0.3s;
            padding: 16px;
            z-index: 100;
        }
        .sidebar.open { transform: translateX(0); }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            opacity: 0;
            visibility: hidden;
            transition: 0.3s;
            z-index: 99;
        }
        .overlay.show {
            opacity: 1;
            visibility: visible;
        }
    </style>
</head>
<body class="bg-bg text-text flex justify-center items-center min-h-screen">

<!-- Nút mở menu -->
<button id="menuBtn" class="fixed top-4 left-4 text-white text-2xl bg-primary p-3 rounded">☰</button>

<!-- Overlay -->
<div id="overlay" class="overlay"></div>

<!-- Sidebar -->
<div id="sidebar" class="sidebar">
    <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold text-white">Danh sách API</h3>
        <button onclick="toggleMenu(false)" class="text-white text-2xl">&times;</button>
    </div>
    <ul>
        <li><button onclick="showAPI('intro')" class="block w-full p-2 bg-muted hover:bg-gray-700 rounded">Giới thiệu</button></li>
        <li><button onclick="showAPI('trends')" class="block w-full p-2 bg-muted hover:bg-gray-700 rounded">Trends API</button></li>
        <li><button onclick="showAPI('user')" class="block w-full p-2 bg-muted hover:bg-gray-700 rounded">User API</button></li>
    </ul>
</div>

<!-- Nội dung -->
<div id="content" class="p-6 w-full max-w-lg">
    <div id="intro-api" class="api-content">
        <h2 class="text-2xl font-bold">Chào mừng đến với API Explorer</h2>
        <p class="text-gray-400">Khám phá các API hữu ích với giao diện thân thiện.</p>
    </div>

    <div id="trends-api" class="api-content hidden">
        <h2 class="text-2xl font-bold">Trends API</h2>
        <input id="woeid" type="number" placeholder="Nhập WOEID" class="border border-border bg-muted text-text p-2 rounded w-full mb-3">
        <button id="fetchTrends" class="bg-primary text-white p-2 rounded w-full">Thử ngay</button>
        <pre class="bg-muted border p-3 rounded text-xs"><code id="result-trends"></code></pre>
    </div>

    <div id="user-api" class="api-content hidden">
        <h2 class="text-2xl font-bold">User API</h2>
        <input id="userId" type="number" placeholder="Nhập User ID" class="border border-border bg-muted text-text p-2 rounded w-full mb-3">
        <button id="fetchUser" class="bg-primary text-white p-2 rounded w-full">Thử ngay</button>
        <pre class="bg-muted border p-3 rounded text-xs"><code id="result-user"></code></pre>
    </div>
</div>

<script>
    function toggleMenu(open) {
        document.getElementById("sidebar").classList.toggle("open", open);
        document.getElementById("overlay").classList.toggle("show", open);
        document.getElementById("menuBtn").style.display = open ? "none" : "block";
    }

    function showAPI(api) {
        document.querySelectorAll(".api-content").forEach(el => el.classList.add("hidden"));
        document.getElementById(api + "-api").classList.remove("hidden");
        toggleMenu(false);
    }

    function fetchData(inputId, resultId, data) {
        const inputValue = document.getElementById(inputId).value.trim();
        if (!inputValue) return alert("Vui lòng nhập dữ liệu");
        document.getElementById(resultId).textContent = JSON.stringify(data, null, 2);
    }

    document.getElementById("fetchTrends").addEventListener("click", () => {
        fetchData("woeid", "result-trends", { trends: ["Công Nghệ Mới", "Bóng Đá Hôm Nay"] });
    });

    document.getElementById("fetchUser").addEventListener("click", () => {
        fetchData("userId", "result-user", { id: "123", name: "Người dùng A" });
    });
</script>

</body>
</html>
