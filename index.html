<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Explorer</title>

    <style>
        /* Giao diện chính */
        body {
            background-color: #0D1117;
            color: #E6EDF3;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        h2 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        p {
            color: #8B949E;
            margin-bottom: 10px;
        }

        /* Ô nhập và nút */
        .input-group {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #30363D;
            background-color: #21262D;
            color: #E6EDF3;
            font-size: 16px;
            outline: none;
        }

        button {
            padding: 10px 16px;
            border-radius: 10px;
            border: none;
            background-color: #A855F7;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease-in-out;
        }

        button:hover {
            background-color: #8B949E;
        }

        button:active {
            box-shadow: 0 0 10px #A855F7;
        }

        /* Danh sách nút API */
        .api-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .api-buttons button {
            border-radius: 20px;
            padding: 12px 24px;
            font-weight: bold;
        }

        /* Hiệu ứng phát sáng khi nhấn vào nút API */
        .api-buttons button:active {
            box-shadow: 0 0 15px #A855F7;
        }

        /* Code block */
        pre {
            background-color: #161B22;
            color: #A0B0C0;
            padding: 16px;
            border-radius: 5px;
            overflow-x: auto;
            font-size: 14px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Danh sách các nút API -->
        <div class="api-buttons">
            <button onclick="scrollToAPI('intro')">Giới thiệu</button>
            <button onclick="scrollToAPI('trends')">Trends API</button>
            <button onclick="scrollToAPI('user')">User API</button>
        </div>

        <!-- Giới thiệu API -->
        <div id="intro">
            <h2>Chào mừng đến với API Explorer</h2>
            <p>Khám phá các API hữu ích với giao diện đơn giản và dễ sử dụng.</p>
        </div>

        <!-- Trends API -->
        <div id="trends">
            <h2>Trends API</h2>
            <p>Nhập WOEID để tìm kiếm xu hướng.</p>
            <div class="input-group">
                <input id="woeid" type="number" placeholder="Nhập WOEID">
                <button id="fetchTrends">Thử ngay</button>
            </div>
            <pre><code id="result-trends" class="json"></code></pre>
        </div>

        <!-- User API -->
        <div id="user">
            <h2>User API</h2>
            <p>Lấy thông tin người dùng bằng ID.</p>
            <div class="input-group">
                <input id="userId" type="number" placeholder="Nhập User ID">
                <button id="fetchUser">Thử ngay</button>
            </div>
            <pre><code id="result-user" class="json"></code></pre>
        </div>
    </div>

    <script>
        function scrollToAPI(apiId) {
            document.getElementById(apiId).scrollIntoView({ behavior: "smooth", block: "start" });
        }

        function displayData(id, data) {
            document.getElementById(id).textContent = JSON.stringify(data, null, 2);
        }

        document.getElementById("fetchTrends").addEventListener("click", () => {
            const woeid = document.getElementById("woeid").value.trim();
            if (!woeid) {
                alert("Vui lòng nhập WOEID");
                return;
            }

            const sampleData = { "data": [{ "trend_name": "Công Nghệ Mới" }, { "trend_name": "Bóng Đá Hôm Nay" }] };
            displayData("result-trends", sampleData);
        });

        document.getElementById("fetchUser").addEventListener("click", () => {
            const userId = document.getElementById("userId").value.trim();
            if (!userId) {
                alert("Vui lòng nhập User ID");
                return;
            }

            const sampleData = { "user": { "id": userId, "name": "Người dùng A", "email": "user@example.com" } };
            displayData("result-user", sampleData);
        });
    </script>

</body>
</html>
