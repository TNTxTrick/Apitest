<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Explorer</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <script type="text/javascript">
        window.tailwind.config = {
            darkMode: ['class'],
            theme: {
                extend: {
                    colors: {
                        background: '#0D1117',
                        foreground: '#E6EDF3',
                        card: '#161B22',
                        border: '#30363D',
                        primary: '#A855F7', /* Màu tím 🟣 */
                        secondary: '#8B949E',
                        muted: '#21262D'
                    },
                }
            }
        }
    </script>

    <style>
        /* Hiệu ứng mờ cho menu */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 250px;
            height: 100%;
            background: rgba(22, 27, 34, 0.8);
            backdrop-filter: blur(8px);
            transform: translateX(-100%);
            transition: transform 0.3s ease-in-out;
            padding: 16px;
            box-shadow: 4px 0 10px rgba(0, 0, 0, 0.3);
            z-index: 100;
        }
        .sidebar.open {
            transform: translateX(0);
        }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease-in-out;
            z-index: 99;
        }
        .overlay.show {
            opacity: 1;
            visibility: visible;
        }
    </style>
</head>
<body class="bg-background text-foreground min-h-screen flex justify-center items-center">

<!-- Nút mở Menu -->
<button id="menuBtn" onclick="toggleMenu(true)" class="fixed top-4 left-4 text-white text-2xl bg-primary p-3 rounded-md z-50">☰</button>

<!-- Overlay nền tối khi menu mở -->
<div id="overlay" class="overlay"></div>

<!-- Sidebar Menu -->
<div id="sidebar" class="sidebar">
    <div class="flex justify-between items-center mb-4">
        <h3 class="text-xl font-bold text-white">Danh sách API</h3>
        <button onclick="toggleMenu(false)" class="text-white text-2xl">&times;</button>
    </div>
    <ul>
        <li class="mb-2"><button onclick="showAPI('intro')" class="w-full text-left p-2 bg-muted hover:bg-gray-700 rounded">Giới thiệu</button></li>
        <li class="mb-2"><button onclick="showAPI('trends')" class="w-full text-left p-2 bg-muted hover:bg-gray-700 rounded">Trends API</button></li>
        <li class="mb-2"><button onclick="showAPI('user')" class="w-full text-left p-2 bg-muted hover:bg-gray-700 rounded">User API</button></li>
    </ul>
</div>

<!-- Main Content -->
<div id="content" class="p-6 mx-auto w-full max-w-2xl mt-12">
    <!-- Trang giới thiệu API (Hiển thị đầu tiên) -->
    <div id="intro-api" class="api-content">
        <h2 class="text-3xl font-bold mb-3">Chào mừng đến với API Explorer</h2>
        <p class="text-secondary mb-4">Khám phá các API hữu ích với giao diện thân thiện.</p>
    </div>

    <!-- Trends API -->
    <div id="trends-api" class="api-content hidden">
        <h2 class="text-3xl font-bold mb-3">Trends API</h2>
        <p class="text-secondary mb-4">Nhập WOEID để tìm kiếm xu hướng.</p>
        <input id="woeid" type="number" placeholder="Nhập WOEID"
               class="border border-border bg-muted text-foreground p-2 rounded w-full mb-3 outline-none">
        <button id="fetchTrends" class="bg-primary text-white hover:bg-purple-600 p-2 rounded w-full">Thử ngay</button>
        <pre class="bg-muted text-secondary border border-border p-3 rounded mt-2 overflow-x-auto text-xs">
            <code id="result-trends" class="json hljs"></code>
        </pre>
    </div>

    <!-- User API -->
    <div id="user-api" class="api-content hidden">
        <h2 class="text-3xl font-bold mb-3">User API</h2>
        <p class="text-secondary mb-4">Lấy thông tin người dùng bằng ID.</p>
        <input id="userId" type="number" placeholder="Nhập User ID"
               class="border border-border bg-muted text-foreground p-2 rounded w-full mb-3 outline-none">
        <button id="fetchUser" class="bg-primary text-white hover:bg-purple-600 p-2 rounded w-full">Thử ngay</button>
        <pre class="bg-muted text-secondary border border-border p-3 rounded mt-2 overflow-x-auto text-xs">
            <code id="result-user" class="json hljs"></code>
        </pre>
    </div>
</div>

<script>
    function toggleMenu(open) {
        const sidebar = document.getElementById("sidebar");
        const overlay = document.getElementById("overlay");
        const menuBtn = document.getElementById("menuBtn");

        if (open) {
            sidebar.classList.add("open");
            overlay.classList.add("show");
            menuBtn.style.display = "none"; // Ẩn nút ☰ khi menu mở
        } else {
            sidebar.classList.remove("open");
            overlay.classList.remove("show");
            menuBtn.style.display = "block"; // Hiện lại nút ☰ khi menu đóng
        }
    }

    function showAPI(apiName) {
        document.querySelectorAll(".api-content").forEach(el => el.classList.add("hidden"));
        document.getElementById(apiName + "-api").classList.remove("hidden");

        // Đóng menu khi chọn API
        toggleMenu(false);
    }

    function displayData(id, data) {
        const resultContainer = document.getElementById(id);
        resultContainer.textContent = JSON.stringify(data, null, 2);
        hljs.highlightElement(resultContainer);
    }

    document.getElementById("fetchTrends").addEventListener("click", async () => {
        const woeid = document.getElementById("woeid").value.trim();
        if (!woeid) {
            alert("Vui lòng nhập WOEID");
            return;
        }

        const sampleData = { "data": [{ "trend_name": "Công Nghệ Mới" }, { "trend_name": "Bóng Đá Hôm Nay" }] };
        displayData("result-trends", sampleData);
    });

    document.getElementById("fetchUser").addEventListener("click", async () => {
        const userId = document.getElementById("userId").value.trim();
        if (!userId) {
            alert("Vui lòng nhập User ID");
            return;
        }

        const sampleData = { "user": { "id": userId, "name": "Người dùng A", "email": "user@example.com" } };
        displayData("result-user", sampleData);
    });
</script>

</body>
</html>
