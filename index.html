<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:image" content="https://i.imgur.com/fvTniH6.jpeg" />
  <meta charset="UTF-8">
    <meta property="og:title" content="TNTXTRICK | API" />
    <meta property="og:url" content="" />
  <link href="https://i.imgur.com/qtwgSL5.jpeg" rel="icon">
  <link href="https://i.imgur.com/qtwgSL5.jpeg" rel="apple-touch-icon">
    <title>Web API For Free</title>
    <style>
        html {
          height: 100%;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            margin-bottom: 20px;
            color: #333;
        }

        .api-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        p {
            font-size: 16px;
            line-height: 1.5;
            color: #666;
            margin: 0;
        }

        .api-button {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 5px;
            background-color: #007BFF;
            color: #fff;
            text-decoration: none;
            font-size: 16px;
            cursor: pointer;
        }

        .api-button:hover {
            background-color: #0056b3;
        }

        .api-info {
            display: flex;
            align-items: center;
        }

        .api-info p {
            margin-left: 10px;
        }
        h5 {
            margin-bottom: 20px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to Server API</h1>
      <h5>
        [ Base URL: https:// ]
      </h5>
      <p>
        API synthesizes many entertainment platforms and games, anime characters.
      </p>
      <h3>
        List API
      </h3>
      <hr>
        <div class="api-section">
            <div class="api-info">
                <a href="/api/capcut" class="api-button">GET</a>
                <p>/api/capcut</p>
            </div>
        </div>
        <div class="api-section">
            <div class="api-info">
                <a href="/api/another-endpoint" class="api-button">GET</a>
                <p>/api/another-endpoint</p>
            </div>
        </div>
    </div>
</body>
</html>
